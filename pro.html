<script>
const SUPABASE_URL = 'https://utavpdhphdztvrmzyeeo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yZEruV2rXCf3J8Al_nkavQ_610QCELB';
const TENANT_ID    = '00000000-0000-0000-0000-000000000001';
const SHOP_TELS = { local: '07 50 05 22 96', tours: '07 57 77 05 87', veigne: '07 57 77 05 39', 'saint-avertin': '09 80 99 96 52' };
const BOUTIQUE_NAMES = { local: 'Le Local', tours: 'Tours', veigne: 'Veigné', 'saint-avertin': 'Saint-Avertin' };
const DOW_NAMES = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const DOW_SHORT = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
const STATUT_LBL = { confirme: 'confirmée', livre: 'livrée', brouillon: 'brouillon', a_valider: 'à valider', annule: 'annulée' };
let supa = null;

/* ---------- helpers ---------- */
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dowOf(iso) { return new Date(iso + 'T12:00').getDay(); }
function formatDateFr(iso) { return new Date(iso + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function heureLbl(h) { if (!h) return ''; const p = h.split(':'); return String(+p[0]) + 'h' + (p[1] === '00' ? '' : p[1]); }
let _toastT = null;
function toast(msg, cls) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (cls ? ' ' + cls : ''); clearTimeout(_toastT); _toastT = setTimeout(function() { t.className = 'toast'; }, 2600); }

/* ---------- état ---------- */
let token = null;
let etabs = [];          // les établissements du client (1, ou plusieurs si groupe) ; etabs[0] = la fiche du lien
let products = [];       // tous les produits actifs
let orders = [];         // pro_orders des établissements, −30 j → +30 j, non annulées, avec items
let tab = 'home';
let draft = null;        // { date, qty: { etabId: { productId: n } }, notes, who, editing: bool }
let detailKey = null;    // 'etabId|date' commande ouverte en détail
let doneInfo = null;     // { date } après validation
let teamEdit = null;     // null | -1 (nouveau) | index

/* ---------- règles métier (identiques à l'app interne) ---------- */
// v20.290 — deux créneaux par jour (matin / après-midi) : même règle que l'app interne (proCreneauCfg).
// L'après-midi reprend les jours cochés, avec sa propre heure limite et son heure de retrait (fiche : creneau_aprem).
const CRENEAUX = ['matin', 'apres_midi'];
const CRENEAU_LBL = { matin: 'Matin', apres_midi: 'Après-midi' };
const CRENEAU_ICO = { matin: '🌅', apres_midi: '🌇' };
function deuxCreneaux(etab) { return !!(etab && etab.creneau_aprem && etab.creneau_aprem.actif); }
function creneauCfg(etab, iso, creneau) {
  const cfg = (etab.jours_livraison || {})[DOW_NAMES[dowOf(iso)]];
  if (!cfg || !cfg.actif) return null;
  if (creneau !== 'apres_midi') return cfg;
  if (!deuxCreneaux(etab)) return null;
  const a = etab.creneau_aprem;
  return { actif: true, butoir_decalage: (a.butoir_decalage != null ? a.butoir_decalage : 0), butoir_heure: a.butoir_heure || '11:00', livraison: a.livraison || '' };
}
function creneauLbl(c) { return c === 'apres_midi' ? 'après-midi' : 'matin'; }
// étiquette dans les listes : seulement pour un client à deux créneaux (rien ne change pour les autres)
function creneauTag(etab, c) { return (deuxCreneaux(etab) || c === 'apres_midi') ? '<span class="cr' + (c === 'apres_midi' ? ' ap' : '') + '">' + CRENEAU_ICO[c || 'matin'] + ' ' + CRENEAU_LBL[c || 'matin'] + '</span>' : ''; }
function butoirMs(etab, iso, creneau) {
  const cfg = creneauCfg(etab, iso, creneau || 'matin');
  if (!cfg || !cfg.actif) return null;
  const dec = cfg.butoir_decalage != null ? cfg.butoir_decalage : -1;
  const heure = cfg.butoir_heure || '23:59';
  const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + dec);
  const p = heure.split(':'); const hh = parseInt(p[0], 10), mm = parseInt(p[1], 10); d.setHours(isNaN(hh) ? 23 : hh, isNaN(mm) ? 59 : mm, 0, 0);
  return d.getTime();
}
function etabOpen(etab, iso, creneau) { const b = butoirMs(etab, iso, creneau); return b != null && Date.now() < b; }
// ouvert à la commande pour AU MOINS un créneau de ce jour
function etabOpenAny(etab, iso) { return CRENEAUX.some(function(c) { return etabOpen(etab, iso, c); }); }
function livraisonHeure(etab, iso, creneau) { const cfg = creneauCfg(etab, iso, creneau || 'matin'); return cfg && cfg.livraison ? heureLbl(cfg.livraison) : ''; }
function butoirTxt(etab, iso, creneau) {
  const b = butoirMs(etab, iso, creneau); if (b == null) return '';
  const d = new Date(b); const j = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const hh = heureLbl(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
  const t = todayISO();
  if (j === t) return (d.getHours() >= 17 ? 'ce soir ' : 'aujourd\'hui ') + hh;
  if (j === addDays(t, 1)) return 'demain ' + hh;
  return DOW_NAMES[d.getDay()] + ' ' + d.getDate() + ' à ' + hh;
}
function catalogueOf(etab) {
  return products.filter(function(p) {
    if (!p.actif) return false;
    if (p.pros_only_id && p.pros_only_id !== etab.id) return false;
    if (Array.isArray(etab.catalogue_restreint)) return etab.catalogue_restreint.indexOf(p.id) !== -1;   // v20.286 — liste vide = rien
    return true;
  });
}
function catalogueUnion() {
  const seen = {}, out = [];
  etabs.forEach(function(e) { catalogueOf(e).forEach(function(p) { if (!seen[p.id]) { seen[p.id] = true; out.push(p); } }); });
  return out.sort(function(a, b) { return (a.name || '').localeCompare(b.name || '', 'fr'); });
}
function inCatalogue(etab, pid) { return catalogueOf(etab).some(function(p) { return p.id === pid; }); }
function productName(pid) { const p = products.find(function(x) { return x.id === pid; }); return p ? p.name : pid; }
// v20.275 — conditionnement imposé (fiche produit : caisse de 8, sac de 20…) : le compteur compte des colis, la commande reste en pièces
function prodOf(pid) { return products.find(function(x) { return x.id === pid; }); }
function packOf(p) { if (!p || !p.conditioning_unit || ['kg', 'L', 'piece'].indexOf(p.conditioning_unit) !== -1) return 0; const q = Number(p.conditioning_qty); return q > 1 ? q : 0; }
function packWord(p, n) { return (p.conditioning_unit || 'colis') + (n > 1 ? 's' : ''); }
function packLabel(p) { const pk = packOf(p); return pk ? packWord(p, 1) + ' de ' + pk + ' pièces' : (p.unit || 'pièce'); }
function fmtQty(p, pieces) { const pk = packOf(p); if (!pk) return String(pieces); const c = Math.round(pieces / pk * 100) / 100; return c + ' ' + packWord(p, c) + ' (' + pieces + ' p.)'; }

function refreshTotals() {

async function saveOrder() {
  const d = draft; if (!d) return;
  const items = {}; let any = false;
  etabs.forEach(function(e) { items[e.id] = Object.keys(d.qty[e.id]).filter(function(pid) { return Number(d.qty[e.id][pid]) > 0 && inCatalogue(e, pid); }).map(function(pid) { return { product_id: pid, qty: Number(d.qty[e.id][pid]) }; }); if (items[e.id].length) any = true; });
  if (!any && !(d.notes || '').trim()) { toast('Ajoute au moins un produit', 'err'); return; }
  if (teamEligible().length > 1 && !(d.who || '').trim()) { toast('Choisis qui passe la commande', 'err'); return; }
  const fermes = etabs.filter(function(e) { return items[e.id].length && !jourPossible(e, d.date); });   // v20.286
  if (fermes.length) { const src = fermes[0].boutique_principale || 'local'; toast((BOUTIQUE_NAMES[src] || 'La boulangerie') + ' est fermé ce ' + DOW_NAMES[dowOf(d.date)] + ' : pas de livraison possible ce jour-là', 'err'); return; }
  const tooLate = etabs.filter(function(e) { return (items[e.id].length || ordersOf(e.id, d.date, d.creneau).length) && !etabOpen(e, d.date, d.creneau); });
  if (tooLate.length) { const src = tooLate[0].boutique_principale || 'local'; toast('Trop tard pour ' + formatDateFr(d.date) + ' : appelle ' + (BOUTIQUE_NAMES[src] || 'la boulangerie') + ' au ' + (SHOP_TELS[src] || SHOP_TELS.local), 'err'); return; }
  const created_by = 'pro_self' + ((d.who || '').trim() ? ':' + d.who.trim() : '');
  for (let i = 0; i < etabs.length; i++) {
    const e = etabs[i];
    const had = ordersOf(e.id, d.date, d.creneau);
    if (!items[e.id].length && !had.length && !(etabs.length === 1 && (d.notes || '').trim())) continue;   // rien pour cet établissement
    const r = await saveSplit(e, d.date, items[e.id], (d.notes || '').trim() || null, created_by, had.length > 0, d.creneau);
    if (r.error) { toast('Erreur : ' + r.error, 'err'); return; }
  }
  await loadOrders();
  doneInfo = { date: d.date, creneau: d.creneau, editing: d.editing }; draft = null; tab = 'home';
  render(); window.scrollTo(0, 0);

// même découpage par site que l'app interne (sources par catégorie), un morceau par site
async function saveSplit(etab, date, items, notes, created_by, editing, creneau) {
  creneau = (creneau === 'apres_midi') ? 'apres_midi' : 'matin';   // v20.290
  const groups = {};
  for (let k = 0; k < items.length; k++) { const src = sourceEffective(etab, sourceFor(etab, items[k].product_id), date); if (src === null) return { error: 'fermé ce jour-là' }; (groups[src] = groups[src] || []).push(items[k]); }
  if (!Object.keys(groups).length) { const s0 = sourceEffective(etab, etab.boutique_principale || 'local', date); if (s0 === null) return { error: 'fermé ce jour-là' }; groups[s0] = []; }
  // v20.289 — les morceaux existants viennent de la base (fonction filtrée par le lien), pas de l'écran
  let siblings = [];
  if (editing) { const s = await supa.rpc('pro_page_orders', { p_token: token, p_from: date, p_to: date }); siblings = (s.data || []).filter(function(o) { return o.pro_id === etab.id && o.statut !== 'annule' && (o.creneau || 'matin') === creneau; }); }
  const used = [];
  const sources = Object.keys(groups);
  for (let i = 0; i < sources.length; i++) {
    const src = sources[i];
    const row = { pro_id: etab.id, date_livraison: date, boutique_source: src, statut: 'confirme', notes: notes, created_by: created_by, creneau: creneau };
    const target = siblings.find(function(s) { return s.boutique_source === src && used.indexOf(s.id) === -1; });
    if (!target && !groups[src].length) continue;
    const items = groups[src].map(function(it) { return { product_id: it.product_id, qty: it.qty, prix_applique: appliedPrice(etab, it.product_id) }; });
    const res = await supa.rpc('pro_page_upsert_order', { p_token: token, p_order_id: target ? target.id : null, p_row: row, p_items: items });
    if (res.error) return { error: res.error.message };
    if (target) used.push(target.id);
  }
  const restes = siblings.filter(function(s) { return used.indexOf(s.id) === -1; }).map(function(s) { return s.id; });
  if (restes.length) { const c = await supa.rpc('pro_page_cancel', { p_token: token, p_ids: restes, p_delete_items: true }); if (c.error) return { error: c.error.message }; }
  return { ok: true };
}

async function teamSave(idx) {

async function teamDelete(idx) {
