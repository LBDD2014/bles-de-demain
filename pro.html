<script>
const SUPABASE_URL = 'https://utavpdhphdztvrmzyeeo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yZEruV2rXCf3J8Al_nkavQ_610QCELB';
const TENANT_ID    = '00000000-0000-0000-0000-000000000001';
const SHOP_TELS = { local: '07 50 05 22 96', tours: '07 57 77 05 87', veigne: '07 57 77 05 39', 'saint-avertin': '09 80 99 96 52' };
const BOUTIQUE_NAMES = { local: 'Le Local', tours: 'Tours', veigne: 'Veigné', 'saint-avertin': 'Saint-Avertin' };
const DOW_NAMES = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const DOW_SHORT = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
const STATUT_LBL = { confirme: 'confirmée', livre: 'livrée', brouillon: 'brouillon', a_valider: 'à valider', annule: 'annulée' };
let supa = null;

/* ---------- helpers ---------- */
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dowOf(iso) { return new Date(iso + 'T12:00').getDay(); }
function formatDateFr(iso) { return new Date(iso + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, function(c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function heureLbl(h) { if (!h) return ''; const p = h.split(':'); return String(+p[0]) + 'h' + (p[1] === '00' ? '' : p[1]); }
let _toastT = null;
function toast(msg, cls) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (cls ? ' ' + cls : ''); clearTimeout(_toastT); _toastT = setTimeout(function() { t.className = 'toast'; }, 2600); }

/* ---------- état ---------- */
let token = null;
let etabs = [];          // les établissements du client (1, ou plusieurs si groupe) ; etabs[0] = la fiche du lien
let products = [];       // tous les produits actifs
let orders = [];         // pro_orders des établissements, −30 j → +30 j, non annulées, avec items
let tab = 'home';
let draft = null;        // { date, qty: { etabId: { productId: n } }, notes, who, editing: bool }
let detailKey = null;    // 'etabId|date' commande ouverte en détail
let doneInfo = null;     // { date } après validation
let teamEdit = null;     // null | -1 (nouveau) | index

/* ---------- règles métier (identiques à l'app interne) ---------- */
function butoirMs(etab, iso) {
  const cfg = (etab.jours_livraison || {})[DOW_NAMES[dowOf(iso)]];
  if (!cfg || !cfg.actif) return null;
  const dec = cfg.butoir_decalage != null ? cfg.butoir_decalage : -1;
  const heure = cfg.butoir_heure || '23:59';
  const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + dec);
  const p = heure.split(':'); const hh = parseInt(p[0], 10), mm = parseInt(p[1], 10); d.setHours(isNaN(hh) ? 23 : hh, isNaN(mm) ? 59 : mm, 0, 0);
  return d.getTime();
}
function etabOpen(etab, iso) { const b = butoirMs(etab, iso); return b != null && Date.now() < b; }
function livraisonHeure(etab, iso) { const cfg = (etab.jours_livraison || {})[DOW_NAMES[dowOf(iso)]]; return cfg && cfg.livraison ? heureLbl(cfg.livraison) : ''; }
function butoirTxt(etab, iso) {
  const b = butoirMs(etab, iso); if (b == null) return '';
  const d = new Date(b); const j = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const hh = heureLbl(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
  const t = todayISO();
  if (j === t) return (d.getHours() >= 17 ? 'ce soir ' : 'aujourd\'hui ') + hh;
  if (j === addDays(t, 1)) return 'demain ' + hh;
  return DOW_NAMES[d.getDay()] + ' ' + d.getDate() + ' à ' + hh;
}
function catalogueOf(etab) {
  return products.filter(function(p) {
    if (!p.actif) return false;
    if (p.pros_only_id && p.pros_only_id !== etab.id) return false;
    if (Array.isArray(etab.catalogue_restreint) && etab.catalogue_restreint.length) return etab.catalogue_restreint.indexOf(p.id) !== -1;
    return true;
  });
}
function catalogueUnion() {
  const seen = {}, out = [];
  etabs.forEach(function(e) { catalogueOf(e).forEach(function(p) { if (!seen[p.id]) { seen[p.id] = true; out.push(p); } }); });
  return out.sort(function(a, b) { return (a.name || '').localeCompare(b.name || '', 'fr'); });
}
function inCatalogue(etab, pid) { return catalogueOf(etab).some(function(p) { return p.id === pid; }); }
function productName(pid) { const p = products.find(function(x) { return x.id === pid; }); return p ? p.name : pid; }
function productCategory(pid) { const p = products.find(function(x) { return x.id === pid; }); return p ? p.category : null; }
function sourceFor(etab, pid) { const cat = productCategory(pid); const spc = etab.sources_par_categorie || {}; return (cat && spc[cat]) ? spc[cat] : (etab.boutique_principale || 'local'); }
function appliedPrice(etab, pid) { if (etab.prix_speciaux && etab.prix_speciaux[pid] != null) return Number(etab.prix_speciaux[pid]); const p = products.find(function(x) { return x.id === pid; }); return (p && p.prix_cession != null) ? Number(p.prix_cession) : null; }
// « Tours » / « Chambray-les-Tours » à partir de « DAKOTA CAFE Tours » / « DAKOTA CAFE CHAMBRAY-LES-TOURS »
function shortLabel(etab) {
  if (etabs.length < 2) return etab.nom || '';
  const words = etabs.map(function(e) { return (e.nom || '').split(/\s+/); });
  let common = 0;
  while (words.every(function(w) { return w[common] && w[common].toLowerCase() === words[0][common].toLowerCase(); }) && common < words[0].length - 1) common++;
  const rest = (etab.nom || '').split(/\s+/).slice(common).join(' ') || etab.nom || '';
  return rest.length > 3 && rest === rest.toUpperCase() ? rest.charAt(0) + rest.slice(1).toLowerCase() : rest;
}
function ordersOf(etabId, iso) { return orders.filter(function(o) { return o.pro_id === etabId && o.date_livraison === iso && o.statut !== 'annule'; }); }
function itemsOf(list) { const m = {}; list.forEach(function(o) { (o.pro_order_items || []).forEach(function(it) { m[it.product_id] = (m[it.product_id] || 0) + Number(it.qty || 0); }); }); return m; }
function statutOf(list) { if (list.some(function(o) { return o.statut === 'livre'; })) return 'livre'; if (list.some(function(o) { return o.statut === 'confirme'; })) return 'confirme'; return list[0] ? list[0].statut : 'confirme'; }
// une « commande » côté client = un établissement × une date (les morceaux par site sont regroupés)
function groupedOrders() {
  const seen = {}, out = [];
  orders.forEach(function(o) {
    if (o.statut === 'annule') return;
    const k = o.pro_id + '|' + o.date_livraison;
    if (seen[k]) return; seen[k] = true;
    const list = ordersOf(o.pro_id, o.date_livraison);
    const etab = etabs.find(function(e) { return e.id === o.pro_id; }) || {};
    out.push({ key: k, etab: etab, date: o.date_livraison, items: itemsOf(list), statut: statutOf(list), notes: list.map(function(x) { return x.notes; }).filter(Boolean)[0] || '', who: (list[0].created_by || '').indexOf('pro_self:') === 0 ? list[0].created_by.slice(9) : '' });
  });
  return out;
}
function summary(items) { const parts = []; Object.keys(items).forEach(function(pid) { if (items[pid] > 0) parts.push(items[pid] + ' ' + productName(pid).replace(/^Pain /i, '')); }); return parts.join(' · ') || 'commande spéciale'; }
function totalPieces(items) { let t = 0; Object.keys(items).forEach(function(k) { t += Number(items[k] || 0); }); return t; }
function teamContacts() {
  const out = [], seen = {};
  etabs.forEach(function(e) { (e.contacts || []).forEach(function(c) { if (c && c.nom && !seen[c.nom.toLowerCase()]) { seen[c.nom.toLowerCase()] = true; out.push(c); } }); });
  return out;
}
function teamEligible() { return teamContacts().filter(function(c) { return c.peut_commander !== false; }); }
function firstName() { const c = teamEligible()[0] || teamContacts()[0]; return c ? c.nom.split(' ')[0] : ''; }
// « la dernière fois » : dernière commande passée de cet établissement (sinon sa commande de base)
function lastItems(etab) {
  const t = todayISO();
  const past = orders.filter(function(o) { return o.pro_id === etab.id && o.date_livraison < t && o.statut !== 'annule' && (o.pro_order_items || []).length; }).sort(function(a, b) { return b.date_livraison.localeCompare(a.date_livraison); });
  if (past.length) return itemsOf(ordersOf(etab.id, past[0].date_livraison));
  const m = {}; (etab.template_items || []).forEach(function(ti) { if (ti.product_id && Number(ti.qty) > 0) m[ti.product_id] = Number(ti.qty); });
  return m;
}

/* ---------- chargement ---------- */
async function init() {
  const params = new URLSearchParams(location.search);
  token = params.get('t') || params.get('pro_token');
  try { if (token) localStorage.setItem('lbdd_pro_t', token); else token = localStorage.getItem('lbdd_pro_t'); } catch (e) {}
  if (!token) return showErr('Lien manquant', 'Ouvre la page depuis le lien que la boulangerie t\'a envoyé.');
  if (location.search.indexOf('pro_token=') !== -1) history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(token));
  try { supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { return showErr('Connexion impossible', e.message); }

async function saveSplit(etab, date, items, notes, created_by, editing) {

    const target = siblings.find(function(s) { return s.boutique_source === src && used.indexOf(s.id) === -1; });
    let orderId;

      const res = await supa.from('pro_orders').update(row).eq('id', target.id).select();

      orderId = target.id; used.push(orderId);

    await supa.from('pro_order_items').delete().eq('pro_order_id', siblings[j].id);

  gs.forEach(function(g) { h += '<div class="card">' + (multi ? '<div class="sec" style="margin:0 0 6px">' + escapeHtml(shortLabel(g.etab)) + '</div>' : '') + '<div class="dtl">' + Object.keys(g.items).filter(function(k) { return g.items[k] > 0; }).map(function(k) { return '<span>' + escapeHtml(productName(k)) + '</span><span class="q">' + g.items[k] + '</span>'; }).join('') + '</div><div class="tot"><span>Total</span><b>' + totalPieces(g.items) + ' pièces</b></div></div>'; });
  if (!gs.length) h += '<div class="card"><div class="empty">Commande sans produit (mot pour la boulangerie).</div></div>';
  if (gs.some(function(g) { return etabOpen(g.etab, g.date); })) h += '<button class="btn2" onclick="openOrder(\'' + doneInfo.date + '\')">✏️ Modifier (jusqu\'à ' + escapeHtml(butoirTxt(e0, doneInfo.date)) + ')</button>';
  h += '<button class="btn2" onclick="go(\'home\')">Retour à l\'accueil</button>';
  b.innerHTML = h;
}
function openDetail(key) { detailKey = key; doneInfo = null; render(); window.scrollTo(0, 0); }
function renderDetail(b) {
  const g = groupedOrders().find(function(x) { return x.key === detailKey; });
  if (!g) { detailKey = null; return render(); }
  setHdr('Commande du ' + DOW_NAMES[dowOf(g.date)] + ' ' + new Date(g.date + 'T12:00').getDate(), (etabs.length > 1 ? shortLabel(g.etab) + ' · ' : '') + (STATUT_LBL[g.statut] || g.statut), true);
  const can = etabOpen(g.etab, g.date) && g.statut !== 'livre';
  let h = '<div class="card"><div class="dtl">' + Object.keys(g.items).filter(function(k) { return g.items[k] > 0; }).map(function(k) { return '<span>' + escapeHtml(productName(k)) + '</span><span class="q">' + g.items[k] + '</span>'; }).join('') + '</div>'
    + '<div class="tot"><span>Total' + (g.who ? ' · commandé par ' + escapeHtml(g.who) : '') + '</span><b>' + totalPieces(g.items) + ' pièces</b></div>' + (g.notes ? '<div class="hint" style="margin:8px 0 0">📝 ' + escapeHtml(g.notes) + '</div>' : '') + '</div>';
  if (can) h += '<button class="btn2" onclick="openOrder(\'' + g.date + '\')">✏️ Modifier (jusqu\'à ' + escapeHtml(butoirTxt(g.etab, g.date)) + ')</button><button class="btn2 danger" onclick="cancelOrder(\'' + g.date + '\',\'' + g.etab.id + '\')">Annuler cette commande</button>';
  else if (g.statut !== 'livre') h += '<div class="hint">Modification clôturée (heure limite dépassée). Pour un dépannage, appelle la boulangerie.</div>';
  h += footerHtml();
  b.innerHTML = h;
}
function renderHistory(b) {
  setHdr('Historique', '30 derniers jours · ' + clientLabel(), false);
  const t = todayISO(), multi = etabs.length > 1;
  const past = groupedOrders().filter(function(g) { return g.date < t; }).sort(function(a, b) { return b.date.localeCompare(a.date); });
  let tot = 0; past.forEach(function(g) { tot += totalPieces(g.items); });
  b.innerHTML = '<div class="card" style="padding:4px 14px">' + (past.length ? past.map(function(g) { return orderRow(g, multi); }).join('') : '<div class="empty">Rien sur les 30 derniers jours.</div>') + '</div>'
    + (past.length ? '<div class="hint" style="text-align:center">' + past.length + ' livraison' + (past.length > 1 ? 's' : '') + ' · ' + tot + ' pièces sur 30 jours</div>' : '') + footerHtml();
}
/* ---------- équipe ---------- */
function renderTeam(b) {
  setHdr('Mon équipe', 'qui peut commander · ' + clientLabel(), false);
  const cs = teamContacts();
  let h = '<div class="hint">Les personnes de ton équipe qui passent commande. Le prénom choisi est noté sur chaque commande, la boulangerie sait qui a commandé.</div><div class="card" style="padding:4px 14px">';
  cs.forEach(function(c, i) {
    h += '<div class="team"><div class="av">' + escapeHtml((c.nom || '?').charAt(0).toUpperCase()) + '</div><div class="m"><b>' + escapeHtml(c.nom) + '</b><div class="r">' + escapeHtml([c.role, c.tel].filter(Boolean).join(' · ')) + (c.peut_commander === false ? ' · consultation seulement' : '') + '</div></div><button class="ed" onclick="teamEdit=' + i + ';render()">✏️</button></div>';
  });
  h += '<div class="team" onclick="teamEdit=-1;render()" style="cursor:pointer"><div class="av">+</div><div class="m" style="color:var(--blue);font-weight:700">Ajouter quelqu\'un</div></div></div>';
  if (teamEdit !== null) {
    const isNew = teamEdit === -1, c = isNew ? { nom: '', tel: '', role: '', peut_commander: true } : (cs[teamEdit] || {});
    h += '<div class="card"><div class="sec" style="margin:0 0 8px">' + (isNew ? '＋ Nouvelle personne' : '✏️ Modifier') + '</div>'
      + '<input id="tm-nom" class="tin" placeholder="Prénom (obligatoire)" value="' + escapeHtml(c.nom || '') + '">'
      + '<input id="tm-tel" class="tin" placeholder="Téléphone (facultatif)" inputmode="tel" value="' + escapeHtml(c.tel || '') + '">'
      + '<input id="tm-role" class="tin" placeholder="Rôle (chef, salle…)" value="' + escapeHtml(c.role || '') + '">'
      + '<label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px"><input id="tm-can" type="checkbox"' + (c.peut_commander !== false ? ' checked' : '') + '> Peut passer commande</label>'
      + '<div style="display:flex;gap:8px"><button class="btn2" style="flex:1;margin:0" onclick="teamEdit=null;render()">Annuler</button>' + (!isNew ? '<button class="btn2 danger" style="flex:0 0 auto;margin:0" onclick="teamDelete(' + teamEdit + ')">🗑</button>' : '') + '<button class="cta" style="flex:2;margin:0;padding:12px;font-size:15px" onclick="teamSave(' + teamEdit + ')">✓ Enregistrer</button></div></div>';
  }
  b.innerHTML = h + footerHtml();
}
async function teamPersist(contacts) {
  // l'équipe est gardée sur la fiche du lien ; les autres établissements du groupe héritent (lecture)
  const r = await supa.from('pros').update({ contacts: contacts }).eq('tenant_id', TENANT_ID).eq('id', etabs[0].id);
  if (r.error) { toast('Erreur : ' + r.error.message, 'err'); return false; }
  etabs[0].contacts = contacts; etabs.slice(1).forEach(function(e) { e.contacts = (e.contacts || []).filter(function(c) { return !contacts.some(function(x) { return x.nom.toLowerCase() === (c.nom || '').toLowerCase(); }); }); });
  return true;
}
async function teamSave(idx) {
  const nom = (document.getElementById('tm-nom').value || '').trim(); if (!nom) { toast('Le prénom est obligatoire', 'err'); return; }
  const entry = { nom: nom, tel: (document.getElementById('tm-tel').value || '').trim(), role: (document.getElementById('tm-role').value || '').trim(), peut_commander: !!document.getElementById('tm-can').checked };
  const contacts = teamContacts().slice();
  if (idx === -1) contacts.push(entry); else contacts[idx] = Object.assign({}, contacts[idx], entry);
  if (!(await teamPersist(contacts))) return;
  teamEdit = null; render(); toast('Enregistré');
}
async function teamDelete(idx) {
  const contacts = teamContacts().slice(); const c = contacts[idx];
  if (!confirm('Retirer « ' + ((c && c.nom) || '?') + ' » de l\'équipe ?')) return;
  contacts.splice(idx, 1);
  if (!(await teamPersist(contacts))) return;
  teamEdit = null; render();
}
init();
</script>
</body>
</html>
